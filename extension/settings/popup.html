<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HLS Player settings</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="settings-shell">
    <header class="settings-header">
      <img src="../icons/icon-32.png" width="28" height="28" alt="">
      <div>
        <h1>HLS Player</h1>
        <p>Player settings</p>
      </div>
    </header>

    <label class="setting-row">
      <span>
        <strong>Seamless mode</strong>
        <small>Show only the video content.</small>
      </span>
      <input id="seamless" type="checkbox">
    </label>

    <label class="setting-row">
      <span>
        <strong>Show video controls</strong>
        <small>Use Firefox's native controls.</small>
      </span>
      <input id="show-controls" type="checkbox">
    </label>

    <label class="setting-row setting-row-select">
      <span>
        <strong>Display / Ratio</strong>
        <small>Video sizing and aspect ratio.</small>
      </span>
      <select id="display-mode">
        <option value="fill">Fill</option>
        <option value="best-fit">Best fit</option>
        <option value="original">Original</option>
        <option value="native">Native</option>
        <option value="16-9">16:9</option>
        <option value="4-3">4:3</option>
      </select>
    </label>

    <p id="save-status" class="save-status" role="status" aria-live="polite">Saved locally in Firefox.</p>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
